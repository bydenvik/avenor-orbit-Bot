# =====================================================================
#  render.yaml  —  RENDER BLUEPRINT (OPTIONAL)  ·  Avenor Orbit
# =====================================================================
#  Ye file sirf "New + -> Blueprint" deploy ke saath chalti hai. Normal
#  "Web Service" me Render ise ignore karta hai — tab Build/Start command aur
#  environment variables Dashboard me khud set karo:
#     Build Command: pip install -r requirements.txt
#     Start Command: python bot.py
# =====================================================================
services:
  - type: web
    name: avenor-orbit
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.13"

      # ---- Required (Dashboard me daalo — sync: false) ----
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_ID
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: AI_API_KEY
        sync: false

      # ---- Storage: 3 chhote fields (MONGO_URI se behtar) ----
      # Atlas > Database > Connect > Drivers > Python se sirf HOST copy karo:
      #   cluster0.abc123.mongodb.net
      - key: MONGO_HOST
        sync: false
      - key: MONGO_USER
        sync: false
      - key: MONGO_PASSWORD
        sync: false
      - key: MONGO_DB
        value: "avenor_orbit"

      # ---- Behaviour ----
      - key: BOT_BRAND
        value: "Avenor Orbit"
      - key: GUEST_MODE          # BotFather > Bot Settings > Guest Mode ON
        value: "True"
      - key: AUTO_APPROVE_JOIN   # join request turant approve, koi button nahi
        value: "True"
      - key: NOTIFY_OWNER
        value: "False"

      # ---- Optional (defaults config.py me hain) ----
      # - key: BOT_USERNAME
      # - key: ADMIN_NAMES
      # - key: AI_MODEL
      #   value: gemini-3.8-flash
      # - key: AI_MODEL_LITE
      #   value: gemini-3.5-flash-lite
